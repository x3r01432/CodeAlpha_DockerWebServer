services:
  web:
    build: .
    image: codealpha-webserver:1.0.0
    container_name: codealpha-web
    ports: ["8080:8080"]
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: unless-stopped
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 64M }
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
